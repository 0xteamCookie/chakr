[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Python client for the AgentShield core: put a firewall in front of any agent tools."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
examples = ["langchain-core>=0.3", "langchain>=0.3", "langchain-google-genai>=2.0", "python-dotenv"]
test = ["pytest>=8", "langchain-core>=0.3"]

[tool.setuptools]
packages = ["agentshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
