packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false   # prebuilt @img/sharp-* binaries are used; building from source fails
minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.89"
  - "@ai-sdk/gateway@4.0.127"
  - "@ai-sdk/google@4.0.106"
  - "@ai-sdk/openai@4.0.103"
  - "@ai-sdk/provider-utils@5.0.69"
  - ai@7.0.154
  - ox@0.14.59
  - viem@2.57.12
